<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#12142a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffd166'/%3E%3Ctext x='32' y='43' font-family='Arial Black,Arial' font-weight='900' font-size='30' text-anchor='middle' fill='%2312142a'%3E2248%3C/text%3E%3C/svg%3E">
<title>2248</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#12142a; --panel:#1b1e3b; --line:#2a2e55; --ink:#eeecf8; --mute:#8d90b8;
    --accent:#ffd166; --cell:64px; --gap:6px;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:Barlow,"Helvetica Neue",Arial,sans-serif; font-size:15px;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    -webkit-user-select:none; user-select:none; touch-action:none; overflow:hidden;
  }
  .wrap{display:flex; flex-direction:column; gap:10px; padding:12px 12px 16px; width:calc(5*var(--cell) + 4*var(--gap)); max-width:100vw}
  header{display:flex; align-items:flex-end; justify-content:space-between; gap:12px}
  h1{
    margin:0; font-family:Syne,Barlow,sans-serif; font-weight:800; font-size:34px; line-height:.9;
    letter-spacing:-.03em; color:var(--accent);
  }
  h1 small{display:block; font-family:Barlow,sans-serif; font-weight:500; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--mute); margin-top:6px}
  .scores{display:flex; gap:6px}
  .score{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:5px 10px; min-width:64px; text-align:right}
  .score b{display:block; font-family:"Barlow Condensed",Barlow,sans-serif; font-weight:700; font-size:22px; line-height:1; font-variant-numeric:tabular-nums}
  .score span{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--mute)}

  .status{
    height:34px; display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:0 10px;
    font-family:"Barlow Condensed",Barlow,sans-serif; font-weight:600; font-size:17px; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden
  }
  .status .hint{color:var(--mute); font-family:Barlow,sans-serif; font-weight:400; font-size:13px; overflow:hidden; text-overflow:ellipsis}
  .status .sum{color:var(--mute); overflow:hidden; text-overflow:ellipsis}
  .status .res{
    flex:none; display:inline-flex; align-items:center; justify-content:center; min-width:44px; height:24px; padding:0 8px;
    border-radius:6px; color:#fff; font-weight:700; text-shadow:0 1px 2px rgba(0,0,0,.35)
  }
  .status.toast .hint{color:var(--accent)}

  .board{position:relative; touch-action:none}
  .cells{display:grid; grid-template-columns:repeat(5,var(--cell)); grid-auto-rows:var(--cell); gap:var(--gap)}
  .cells div{background:var(--panel); border-radius:12px; box-shadow:inset 0 0 0 1px var(--line)}
  .tiles{position:absolute; inset:0}
  .tile{
    position:absolute; left:0; top:0; width:var(--cell); height:var(--cell); border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-family:"Barlow Condensed",Barlow,sans-serif; font-weight:700; color:#fff;
    font-size:calc(var(--cell)*.46); text-shadow:0 1px 2px rgba(0,0,0,.35);
    font-variant-numeric:tabular-nums; letter-spacing:-.01em;
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.18);
    transition:transform .2s var(--ease), opacity .18s, box-shadow .12s;
    will-change:transform;
  }
  .tile.d3{font-size:calc(var(--cell)*.4)}
  .tile.d4{font-size:calc(var(--cell)*.34)}
  .tile.d5{font-size:calc(var(--cell)*.28)}
  .tile.d6{font-size:calc(var(--cell)*.24)}
  .tile.hi{box-shadow:inset 0 -3px 0 rgba(0,0,0,.18), inset 0 0 0 3px rgba(255,255,255,.55)}
  .tile.sel{box-shadow:0 0 0 3px var(--ink), 0 6px 18px rgba(0,0,0,.4); z-index:2}
  .tile.fly{opacity:.5; z-index:1}
  .tile.out{transform-origin:center; opacity:0; scale:.2; transition:scale .2s, opacity .2s}
  .tile.pop{animation:pop .22s var(--ease)}
  @keyframes pop{0%{scale:1}45%{scale:1.18}100%{scale:1}}
  .pts{
    position:absolute; left:0; top:0; width:var(--cell); text-align:center; pointer-events:none; z-index:4;
    font-family:"Barlow Condensed",Barlow,sans-serif; font-weight:700; font-size:calc(var(--cell)*.42);
    color:var(--accent); text-shadow:0 2px 6px rgba(0,0,0,.6); font-variant-numeric:tabular-nums;
    animation:rise .8s var(--ease) forwards;
  }
  .pts small{display:block; font-size:calc(var(--cell)*.2); font-weight:600; color:var(--ink); letter-spacing:.06em}
  @keyframes rise{0%{opacity:0; translate:0 10px; scale:.7}15%{opacity:1; scale:1.1}100%{opacity:0; translate:0 calc(var(--cell)*-1.1); scale:1}}
  .score b.bump{animation:bump .3s var(--ease)}
  @keyframes bump{0%{scale:1}40%{scale:1.25; color:var(--accent)}100%{scale:1}}
  svg.link{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:3}
  svg.link polyline{fill:none; stroke:var(--ink); stroke-width:5; stroke-linecap:round; stroke-linejoin:round; opacity:.85}

  footer{display:flex; align-items:center; justify-content:space-between; gap:8px}
  .range{font-size:12px; color:var(--mute); font-variant-numeric:tabular-nums}
  .range b{color:var(--ink); font-weight:600}
  .btns{display:flex; gap:6px}
  button{
    font:inherit; font-weight:600; font-size:13px; color:var(--ink); background:var(--panel);
    border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer;
  }
  button:hover{border-color:var(--mute)}
  button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  button:disabled{opacity:.4; cursor:default}
  button.primary{background:var(--accent); color:#1a1508; border-color:transparent}

  .over{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center; z-index:5;
    background:rgba(18,20,42,.82); border-radius:12px; backdrop-filter:blur(2px)
  }
  .over.show{display:flex}
  .over .card{text-align:center; display:flex; flex-direction:column; gap:10px; align-items:center}
  .over h2{margin:0; font-family:Syne,sans-serif; font-size:28px; letter-spacing:-.02em}
  .over p{margin:0; color:var(--mute)}
  .over p b{color:var(--ink); font-size:22px; font-family:"Barlow Condensed",sans-serif}

  @media (prefers-reduced-motion:reduce){
    .tile{transition:none} .tile.pop{animation:none} .tile.out{transition:none}
    .pts{animation:fade .8s forwards} .score b.bump{animation:none}
  }
  @keyframes fade{0%{opacity:1}100%{opacity:0}
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>2248<small>Chain-merge puzzle</small></h1>
    <div class="scores">
      <div class="score"><b id="score">0</b><span>Score</span></div>
      <div class="score"><b id="best">0</b><span>Best</span></div>
    </div>
  </header>

  <div class="status" id="status"><span class="hint">Drag through equal tiles. Each next tile may also be double the last.</span></div>

  <div class="board" id="board">
    <div class="cells" id="cells"></div>
    <div class="tiles" id="tiles"></div>
    <svg class="link" id="link"><polyline id="line" points=""></polyline></svg>
    <div class="over" id="over">
      <div class="card">
        <h2>No chains left</h2>
        <p>Final score <b id="finalScore">0</b></p>
        <button class="primary" id="again">Play again</button>
      </div>
    </div>
  </div>

  <footer>
    <div class="range">Lowest <b id="lo">16</b> · Highest <b id="hiV">128</b></div>
    <div class="btns">
      <button id="mute" aria-label="Sound on" title="Toggle sound">🔊</button>
      <button id="undo" disabled>Undo</button>
      <button id="new">New game</button>
    </div>
  </footer>
</div>

<script>
(() => {
  const COLS = 5, ROWS = 8, GAP = 6;
  const START = 4; // lowest tile is 2^START = 16
  const HUES = [172, 204, 236, 268, 302, 338, 10, 30, 48, 82, 122, 150];

  const $ = id => document.getElementById(id);
  const root = document.documentElement;
  const boardEl = $('board'), tilesEl = $('tiles'), lineEl = $('line'), statusEl = $('status');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let cell = 64;
  let tiles = [], grid = [], nextId = 1;
  let score = 0, best = 0, minExp = START;
  let chain = [], dragging = false, busy = false, over = false, history = null;

  // ---------- helpers ----------
  const wait = ms => new Promise(r => setTimeout(r, reduced ? 0 : ms));
  const exp = v => Math.round(Math.log2(v));
  const pos = (r, c) => `translate(${c * (cell + GAP)}px, ${r * (cell + GAP)}px)`;
  const colorFor = v => {
    const e = exp(v), h = HUES[(e - 1) % HUES.length], cyc = Math.floor((e - 1) / HUES.length);
    const l = 54 - cyc * 8, s = 70 + cyc * 8;
    return `linear-gradient(160deg, hsl(${h} ${s}% ${l + 6}%), hsl(${h} ${s + 6}% ${l - 8}%))`;
  };
  const digitsClass = v => { const d = String(v).length; return d >= 6 ? 'd6' : d >= 3 ? 'd' + d : ''; };

  try { best = Number(localStorage.getItem('best2248')) || 0; } catch (e) {}

  // ---------- sound (synthesized, no files) ----------
  let muted = false;
  try { muted = localStorage.getItem('mute2248') === '1'; } catch (e) {}
  let ctx = null;
  function audio() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  // one short tone: type, start freq, end freq, duration, gain
  function tone(type, f0, f1, dur, gain, delay = 0) {
    if (muted) return;
    const ac = audio(); if (!ac) return;
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  // filtered noise burst for thuds and sweeps
  function noise(dur, gain, cutoff, delay = 0) {
    if (muted) return;
    const ac = audio(); if (!ac) return;
    const t = ac.currentTime + delay;
    const len = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ac.createBufferSource(); src.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
    const g = ac.createGain(); g.gain.value = gain;
    src.connect(f).connect(g).connect(ac.destination);
    src.start(t);
  }
  const sfx = {
    pick:  () => tone('triangle', 520, 520, 0.06, 0.12),
    link:  n => { const f = 440 * Math.pow(2, Math.min(n, 12) / 12); tone('triangle', f, f * 1.02, 0.07, 0.14); },
    unlink:() => tone('triangle', 380, 300, 0.07, 0.1),
    merge: v => {
      const e = exp(v), base = 220 * Math.pow(2, ((e - 1) % 12) / 12);
      tone('sine', base, base, 0.22, 0.22);
      tone('sine', base * 1.5, base * 1.5, 0.22, 0.14, 0.03);
      tone('sine', base * 2, base * 2, 0.32, 0.12, 0.06);
      noise(0.08, 0.25, 2500);
    },
    land:  () => noise(0.09, 0.35, 700),
    floor: () => { tone('sawtooth', 900, 120, 0.4, 0.08); noise(0.35, 0.2, 1200); },
    over:  () => { [330, 262, 196, 131].forEach((f, i) => tone('square', f, f * 0.97, 0.28, 0.07, i * 0.18)); },
  };
  const muteBtn = $('mute');
  function renderMute() {
    muteBtn.textContent = muted ? '🔇' : '🔊';
    muteBtn.setAttribute('aria-label', muted ? 'Sound off' : 'Sound on');
  }
  muteBtn.addEventListener('click', () => {
    muted = !muted; renderMute();
    try { localStorage.setItem('mute2248', muted ? '1' : '0'); } catch (e) {}
    if (!muted) sfx.pick();
  });
  renderMute();

  // ---------- sizing ----------
  function fit() {
    const w = Math.min(innerWidth - 24, 420);
    const h = innerHeight - 190;
    cell = Math.max(40, Math.floor(Math.min((w - 4 * GAP) / COLS, (h - 7 * GAP) / ROWS, 80)));
    root.style.setProperty('--cell', cell + 'px');
    for (const t of tiles) t.el.style.transform = pos(t.r, t.c);
    drawLine();
  }
  addEventListener('resize', fit);

  // ---------- board setup ----------
  const cellsEl = $('cells');
  for (let i = 0; i < COLS * ROWS; i++) cellsEl.appendChild(document.createElement('div'));

  function makeTile(v, r, c, startRow) {
    const el = document.createElement('div');
    const t = { id: nextId++, v, r, c, el };
    el.className = 'tile';
    paint(t);
    el.style.transform = pos(startRow ?? r, c);
    tilesEl.appendChild(el);
    tiles.push(t);
    grid[r][c] = t;
    return t;
  }
  function paint(t) {
    t.el.textContent = t.v;
    t.el.style.background = colorFor(t.v);
    t.el.className = 'tile ' + digitsClass(t.v) + (exp(t.v) > HUES.length ? ' hi' : '') + (chain.includes(t) ? ' sel' : '');
  }
  function removeTile(t) {
    tiles.splice(tiles.indexOf(t), 1);
    if (grid[t.r][t.c] === t) grid[t.r][t.c] = null;
    t.el.remove();
  }

  function maxExp() { return tiles.reduce((m, t) => Math.max(m, exp(t.v)), START); }

  function spawnValue() {
    const lo = minExp, hi = Math.max(lo + 1, maxExp() - 3);
    const ws = []; let total = 0;
    for (let e = lo; e <= hi; e++) { const w = Math.pow(0.5, e - lo); ws.push([e, w]); total += w; }
    let r = Math.random() * total;
    for (const [e, w] of ws) { r -= w; if (r <= 0) return 2 ** e; }
    return 2 ** lo;
  }

  function newGame() {
    tiles.forEach(t => t.el.remove());
    tiles = []; grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    score = 0; minExp = START; chain = []; history = null; over = false; busy = false;
    $('over').classList.remove('show'); $('undo').disabled = true;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const roll = Math.random();
      const e = roll < .45 ? 0 : roll < .8 ? 1 : roll < .95 ? 2 : 3;
      makeTile(2 ** (START + e), r, c);
    }
    if (!hasMoves()) return newGame();
    renderHud(); showHint();
  }

  // ---------- HUD ----------
  function renderHud() {
    $('score').textContent = score;
    $('best').textContent = best;
    $('lo').textContent = 2 ** minExp;
    $('hiV').textContent = 2 ** maxExp();
  }
  function showHint(text) {
    statusEl.classList.remove('toast');
    statusEl.innerHTML = `<span class="hint">${text || 'Drag through equal tiles. Each next tile may also be double the last.'}</span>`;
  }
  function showToast(text) {
    statusEl.classList.add('toast');
    statusEl.innerHTML = `<span class="hint">${text}</span>`;
  }
  function showChain() {
    if (chain.length < 2) { showHint(chain.length ? 'Keep going: the next tile must be ' + chain[0].v + ' or ' + chain[0].v * 2 : ''); return; }
    const sum = chain.reduce((a, t) => a + t.v, 0);
    const res = 2 ** Math.floor(Math.log2(sum));
    const terms = chain.map(t => t.v).join(' + ');
    statusEl.classList.remove('toast');
    statusEl.innerHTML = `<span class="sum">${terms} = ${sum}</span><span class="res" style="background:${colorFor(res)}">${res}</span>`;
  }

  // ---------- chain drawing ----------
  function markChain() {
    for (const t of tiles) t.el.classList.toggle('sel', chain.includes(t));
    drawLine(); showChain();
  }
  function drawLine() {
    lineEl.setAttribute('points', chain.map(t => `${t.c * (cell + GAP) + cell / 2},${t.r * (cell + GAP) + cell / 2}`).join(' '));
  }

  // ---------- input ----------
  function tileAt(e) {
    const rect = boardEl.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    const c = Math.floor(x / (cell + GAP)), r = Math.floor(y / (cell + GAP));
    if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return null;
    const cx = c * (cell + GAP) + cell / 2, cy = r * (cell + GAP) + cell / 2;
    if (Math.hypot(x - cx, y - cy) > cell * 0.44) return null;
    return grid[r][c];
  }
  const adjacent = (a, b) => Math.abs(a.r - b.r) <= 1 && Math.abs(a.c - b.c) <= 1;
  const canFollow = (prev, next) => next.v === prev.v || next.v === prev.v * 2;

  let lastPt = null;
  function tryExtend(pt) {
    const t = tileAt(pt); if (!t) return;
    const last = chain[chain.length - 1];
    if (t === last) return;
    if (chain.length >= 2 && t === chain[chain.length - 2]) { chain.pop(); markChain(); sfx.unlink(); return; }
    if (chain.includes(t)) return;
    if (adjacent(t, last) && canFollow(last, t)) { chain.push(t); markChain(); sfx.link(chain.length); }
  }
  function startDrag(pt) {
    if (busy || over) return;
    const t = tileAt(pt); if (!t) return;
    audio();
    dragging = true; lastPt = pt; chain = [t]; markChain(); sfx.pick();
  }
  // A fast swipe delivers sparse move events, so walk the segment from the
  // previous point in quarter-cell steps and test every tile along the way.
  function moveDrag(pt) {
    if (!dragging) return;
    const from = lastPt || pt;
    const dist = Math.hypot(pt.clientX - from.clientX, pt.clientY - from.clientY);
    const steps = Math.max(1, Math.ceil(dist / (cell * 0.25)));
    for (let i = 1; i <= steps; i++) {
      const k = i / steps;
      tryExtend({ clientX: from.clientX + (pt.clientX - from.clientX) * k, clientY: from.clientY + (pt.clientY - from.clientY) * k });
    }
    lastPt = pt;
  }
  function endDrag() { if (!dragging) return; dragging = false; lastPt = null; commitChain(); }

  if (window.PointerEvent) {
    boardEl.addEventListener('pointerdown', e => { startDrag(e); if (dragging) boardEl.setPointerCapture(e.pointerId); });
    boardEl.addEventListener('pointermove', moveDrag);
    boardEl.addEventListener('pointerup', endDrag);
    boardEl.addEventListener('pointercancel', endDrag);
  } else {
    const tp = e => e.touches[0] || e.changedTouches[0];
    boardEl.addEventListener('touchstart', e => { e.preventDefault(); startDrag(tp(e)); }, { passive: false });
    boardEl.addEventListener('touchmove', e => { e.preventDefault(); moveDrag(tp(e)); }, { passive: false });
    boardEl.addEventListener('touchend', endDrag);
    boardEl.addEventListener('touchcancel', endDrag);
    boardEl.addEventListener('mousedown', startDrag);
    boardEl.addEventListener('mousemove', moveDrag);
    addEventListener('mouseup', endDrag);
  }

  // ---------- game flow ----------
  function snapshot() {
    history = { tiles: tiles.map(t => ({ v: t.v, r: t.r, c: t.c })), score, minExp };
    $('undo').disabled = false;
  }
  function undo() {
    if (!history || busy) return;
    tiles.forEach(t => t.el.remove());
    tiles = []; grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    for (const s of history.tiles) makeTile(s.v, s.r, s.c);
    score = history.score; minExp = history.minExp; history = null; over = false;
    $('over').classList.remove('show'); $('undo').disabled = true;
    chain = []; markChain(); renderHud(); showHint();
  }

  async function commitChain() {
    if (chain.length < 2) { chain = []; markChain(); showHint(); return; }
    busy = true;
    snapshot();
    const target = chain[chain.length - 1];
    const sum = chain.reduce((a, t) => a + t.v, 0);
    const result = 2 ** Math.floor(Math.log2(sum));
    const rest = chain.slice(0, -1);
    const links = chain.length;
    const mult = links >= 8 ? 3 : links >= 5 ? 2 : 1; // long chains pay more
    chain = []; lineEl.setAttribute('points', '');

    for (const t of rest) { t.el.classList.remove('sel'); t.el.classList.add('fly'); t.el.style.transform = pos(target.r, target.c); }
    await wait(190);
    rest.forEach(removeTile);
    target.v = result; paint(target); target.el.classList.add('pop'); sfx.merge(result);
    const gained = result * mult;
    score += gained;
    showPoints(target, gained, mult);
    if (score > best) { best = score; try { localStorage.setItem('best2248', best); } catch (e) {} }
    renderHud(); showChain();
    showHint(`${sum} rounds down to <b style="color:var(--ink)">${result}</b>`);
    await wait(180);
    target.el.classList.remove('pop');

    await raiseFloor();
    await gravity();
    await refill();
    renderHud();
    busy = false;
    if (!hasMoves()) gameOver();
  }

  async function raiseFloor() {
    const newMin = Math.max(START, maxExp() - 8);
    if (newMin <= minExp) return;
    const old = minExp; minExp = newMin;
    const gone = tiles.filter(t => exp(t.v) < minExp);
    if (!gone.length) return;
    showToast(`You reached ${2 ** maxExp()}. Every ${old === minExp - 1 ? 2 ** old : 'tile below ' + 2 ** minExp} leaves the board.`);
    sfx.floor();
    gone.forEach(t => t.el.classList.add('out'));
    await wait(220);
    gone.forEach(removeTile);
  }

  async function gravity() {
    let moved = false;
    for (let c = 0; c < COLS; c++) {
      let write = ROWS - 1;
      for (let r = ROWS - 1; r >= 0; r--) {
        const t = grid[r][c];
        if (!t) continue;
        if (r !== write) { grid[write][c] = t; grid[r][c] = null; t.r = write; t.el.style.transform = pos(t.r, t.c); moved = true; }
        write--;
      }
    }
    if (moved) await wait(200);
  }

  async function refill() {
    let added = false;
    for (let c = 0; c < COLS; c++) {
      let empty = 0;
      while (empty < ROWS && !grid[empty][c]) empty++;
      for (let r = 0; r < empty; r++) {
        makeTile(spawnValue(), r, c, r - empty);
        added = true;
      }
    }
    if (!added) return;
    tilesEl.offsetHeight; // flush so the drop animates from above the board
    for (const t of tiles) t.el.style.transform = pos(t.r, t.c);
    await wait(220);
    sfx.land();
  }

  function hasMoves() {
    for (const t of tiles) {
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        if (!dr && !dc) continue;
        const n = grid[t.r + dr]?.[t.c + dc];
        if (n && (canFollow(t, n) || canFollow(n, t))) return true;
      }
    }
    return false;
  }

  function showPoints(t, gained, mult) {
    const el = document.createElement('div');
    el.className = 'pts';
    el.innerHTML = `+${gained}${mult > 1 ? `<small>×${mult} chain</small>` : ''}`;
    el.style.transform = pos(t.r, t.c);
    boardEl.appendChild(el);
    setTimeout(() => el.remove(), 850);
    const sb = $('score'); sb.classList.remove('bump'); void sb.offsetWidth; sb.classList.add('bump');
  }

  function gameOver() {
    over = true; sfx.over();
    $('finalScore').textContent = score;
    $('over').classList.add('show');
  }

  $('undo').addEventListener('click', undo);
  $('new').addEventListener('click', newGame);
  $('again').addEventListener('click', newGame);

  fit();
  newGame();
})();
</script>
</body>
</html>
